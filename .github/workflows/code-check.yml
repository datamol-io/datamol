name: code-quality

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Install quality tools
        run: python -m pip install --upgrade ".[dev]"

      - name: Check formatting
        run: black --check datamol tests

      - name: Lint
        run: ruff check datamol tests

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: twine check dist/*
