version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, ci]
